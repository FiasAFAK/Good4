<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقويم الاقتصادي | آفاق للوساطة المالية</title>
<script>(function(){var t=null;try{t=localStorage.getItem("afak-theme")}catch(e){}if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7ef;--surface:#fff;--text:#1b1710;--muted:#6b6454;--gold:#a67c1a;--line:#e6dec7;--head:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#12100b;--surface:#1c1810;--text:#f1ead6;--muted:#a79d83;--gold:#d9b455;--line:#3a3220;--head:#17140d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 14px;width:100%}
header{background:var(--head);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-family:"Reem Kufi",Cairo,sans-serif;font-size:15px;font-weight:600}
.brand img{width:36px;height:36px;border-radius:50%}
.back-btn{padding:7px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);font-size:13px}
main{flex:1;display:flex;flex-direction:column;padding-top:14px}
h1{font-size:clamp(18px,4vw,24px);font-weight:800;color:var(--gold);margin-bottom:12px}
.box{flex:1;min-height:520px;height:calc(100vh - 190px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tradingview-widget-container,.tradingview-widget-container__widget{height:100%;width:100%}
.note{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 14px}
footer{border-top:1px solid var(--line);padding:14px 0;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="./"><img src="icon-192.png" alt="آفاق"><span>آفاق الوساطة المالية</span></a>
  <a class="back-btn" href="./">← الرئيسية</a>
</div></header>
<main class="wrap">
  <h1>التقويم الاقتصادي</h1>
  <div class="box" id="cal"></div>
  <p class="note">التقويم عبر TradingView، وأسماء الأحداث بالإنجليزية.</p>
</main>
<footer><div class="wrap">© 2026 آفاق للوساطة المالية</div></footer>
<script>
(function(){
var dark=document.documentElement.getAttribute('data-theme')==='dark';
var c=document.createElement('div');c.className='tradingview-widget-container';
var w=document.createElement('div');w.className='tradingview-widget-container__widget';c.appendChild(w);
var s=document.createElement('script');s.async=true;s.src='https://s3.tradingview.com/external-embedding/embed-widget-events.js';
s.text=JSON.stringify({colorTheme:dark?'dark':'light',isTransparent:true,width:'100%',height:'100%',locale:'ar',importanceFilter:'-1,0,1',currencyFilter:'USD,EUR,GBP,JPY,CHF,AUD,CAD,NZD'});
c.appendChild(s);document.getElementById('cal').appendChild(c);
})();
</script>
</body>
</html>
