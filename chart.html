<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="رسوم بيانية مباشرة - معادن، فوركس، أسهم | آفاق للوساطة المالية">
<meta name="theme-color" content="#0a0907">
<title>الرسوم البيانية | آفاق للوساطة المالية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0907;
  --surface: #14110a;
  --text: #f3e3b3;
  --muted: #a89b72;
  --gold: #d9b455;
  --line: #2e2814;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Cairo, Tahoma, sans-serif;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 14px; width: 100%; }

header {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
}
header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Reem Kufi", Cairo, sans-serif;
  font-size: 15px;
  color: var(--text);
  font-weight: 600;
}
.brand img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid #6e5a22;
  color: var(--text);
  font-size: 13px;
  background: transparent;
}

/* Categories */
.cats {
  display: flex;
  gap: 8px;
  padding: 12px 0 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cats button {
  flex: none;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}
.cats button.active {
  background: linear-gradient(135deg, #f1d47a, #b98a22);
  color: #1a1405;
  border-color: transparent;
}

/* Symbol chips */
.symbols {
  display: flex;
  gap: 8px;
  padding: 4px 0 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.symbols::-webkit-scrollbar { display: none; }
.symbols button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #1a160e;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.symbols button.active {
  border-color: var(--gold);
  background: #2a2210;
  color: #f1d47a;
  font-weight: 700;
}
.symbols button .sym-icon {
  font-size: 16px;
  line-height: 1;
}

/* Chart */
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.chart-header h1 {
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 800;
  color: #f6e7b8;
}
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #1a2e1a;
  color: #4ade80;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
}
.live-badge::before {
  content: "";
  width: 7px;
  height: 7px;
  background: #4ade80;
  border-radius: 50%;
  animation: pulse 1.4s infinite;
}
.live-badge.closed { background: #2b1a1a; color: #f87171; }
.live-badge.closed::before { background: #f87171; animation: none; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

.chart-box {
  flex: 1;
  min-height: 480px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #131722;
  position: relative;
}
#tv_chart {
  width: 100%;
  height: 100%;
  min-height: 480px;
}

.note {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 12px;
  padding-bottom: 16px;
}
footer {
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 14px 0;
  text-align: center;
  color: #8d8260;
  font-size: 12px;
}

@media (max-width: 600px) {
  .chart-box, #tv_chart { min-height: 400px; }
  .brand { font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="./">
      <img src="icon-192.png" alt="آفاق">
      <span>آفاق الوساطة المالية</span>
    </a>
    <div class="header-actions">
      <a class="back-btn" href="./">← الرئيسية</a>
    </div>
  </div>
</header>

<main class="wrap" style="flex:1;display:flex;flex-direction:column;padding-top:4px;padding-bottom:8px;">

  <!-- التصنيفات -->
  <div class="cats" id="cats">
    <button data-cat="metals" class="active">معادن</button>
    <button data-cat="forex">فوركس</button>
    <button data-cat="stocks">أسهم ومؤشرات</button>
  </div>

  <!-- الرموز -->
  <div class="symbols" id="symbols"></div>

  <div class="chart-header">
    <h1 id="chartTitle">الذهب</h1>
    <span class="live-badge" id="liveBadge">مباشر</span>
  </div>

  <div class="chart-box">
    <div id="tv_chart"></div>
  </div>

  <p class="note">البيانات عبر TradingView · الأسعار قد تختلف قليلاً حسب الوسيط</p>
</main>

<footer>
  <div class="wrap">© 2026 آفاق للوساطة المالية</div>
</footer>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
(function(){
  // البيانات مع أيقونات
  var DATA = {
    metals: [
      { id: 'OANDA:XAUUSD', name: 'الذهب', label: 'XAUUSD', icon: '🥇' },
      { id: 'OANDA:XAGUSD', name: 'الفضة', label: 'XAGUSD', icon: '🥈' }
    ],
    forex: [
      { id: 'FX:EURUSD', name: 'يورو / دولار', label: 'EURUSD', icon: '🇪🇺🇺🇸' },
      { id: 'FX:GBPUSD', name: 'جنيه / دولار', label: 'GBPUSD', icon: '🇬🇧🇺🇸' },
      { id: 'FX:USDJPY', name: 'دولار / ين', label: 'USDJPY', icon: '🇺🇸🇯🇵' },
      { id: 'FX:USDCHF', name: 'دولار / فرنك', label: 'USDCHF', icon: '🇺🇸🇨🇭' },
      { id: 'FX:AUDUSD', name: 'أسترالي / دولار', label: 'AUDUSD', icon: '🇦🇺🇺🇸' },
      { id: 'FX:USDCAD', name: 'دولار / كندي', label: 'USDCAD', icon: '🇺🇸🇨🇦' },
      { id: 'FX:NZDUSD', name: 'نيوزلندي / دولار', label: 'NZDUSD', icon: '🇳🇿🇺🇸' },
      { id: 'FX:EURGBP', name: 'يورو / جنيه', label: 'EURGBP', icon: '🇪🇺🇬🇧' }
    ],
    stocks: [
      { id: 'FOREXCOM:SPXUSD', name: 'S&P 500', label: 'SPX', icon: '📈' },
      { id: 'FOREXCOM:NSXUSD', name: 'ناسداك', label: 'NAS100', icon: '💻' },
      { id: 'FOREXCOM:DJI', name: 'داو جونز', label: 'US30', icon: '🏛️' },
      { id: 'TVC:UKOIL', name: 'النفط الخام', label: 'USOIL', icon: '🛢️' },
      { id: 'BITSTAMP:BTCUSD', name: 'بيتكوين', label: 'BTCUSD', icon: '₿' }
    ]
  };

  var currentCat = 'metals';
  var currentSymbol = DATA.metals[0];
  var currentInterval = '15'; // minutes
  var widget = null;
  var loadToken = 0; // لمنع تحميل قديم

  var catsEl = document.getElementById('cats');
  var symbolsEl = document.getElementById('symbols');
  var titleEl = document.getElementById('chartTitle');

  // قراءة الرمز من الرابط إن وجد
  function getQuerySymbol() {
    var params = new URLSearchParams(location.search);
    var s = params.get('symbol');
    if (!s) return null;
    for (var cat in DATA) {
      for (var i = 0; i < DATA[cat].length; i++) {
        if (DATA[cat][i].label === s || DATA[cat][i].id === s) {
          return { cat: cat, item: DATA[cat][i] };
        }
      }
    }
    return null;
  }

  function renderSymbols() {
    var list = DATA[currentCat];
    symbolsEl.innerHTML = '';
    list.forEach(function(item) {
      var btn = document.createElement('button');
      btn.innerHTML = '<span class="sym-icon">' + item.icon + '</span> ' + item.label;
      if (item.id === currentSymbol.id) btn.className = 'active';
      btn.onclick = function() {
        if (item.id === currentSymbol.id) return; // already selected
        currentSymbol = item;
        renderSymbols();
        loadChart();
        history.replaceState(null, '', '?symbol=' + item.label);
      };
      symbolsEl.appendChild(btn);
    });
  }

  function loadChart() {
    var myToken = ++loadToken;
    titleEl.textContent = currentSymbol.name;
    updateBadge();

    // تفريغ الحاوية بشكل آمن
    var container = document.getElementById('tv_chart');
    container.innerHTML = '';

    // تأخير بسيط لضمان التنظيف
    setTimeout(function() {
      if (myToken !== loadToken) return; // تم طلب رمز آخر

      container.innerHTML = '';
      widget = new TradingView.widget({
        width: '100%',
        height: '100%',
        symbol: currentSymbol.id,
        interval: currentInterval,
        timezone: 'Asia/Riyadh',
        theme: 'dark',
        style: '1',
        locale: 'ar',
        toolbar_bg: '#0a0907',
        enable_publishing: false,
        hide_top_toolbar: false,
        hide_legend: false,
        save_image: false,
        container_id: 'tv_chart',
        studies: [], // بدون مؤشرات إضافية
        allow_symbol_change: false,
        details: true,
        hotlist: false,
        calendar: false,
        disabled_features: [
          'create_volume_indicator_by_default',
          'volume_force_overlay',
          'create_volume_indicator_by_default_once'
        ],
        enabled_features: [
          'side_toolbar_in_fullscreen_mode',
          'header_in_fullscreen_mode'
        ],
        drawings_access: {
          type: 'white',
          tools: [
            { name: 'horizontal_line' },
            { name: 'trend_line' },
            { name: 'rectangle' },
            { name: 'arrow' },
            { name: 'long_position' },
            { name: 'short_position' }
          ]
        },
        overrides: {
          'volumePaneSize': 'tiny',
          'mainSeriesProperties.showCountdown': true,
          'scalesProperties.showSeriesLastValue': true
        }
      });
    }, 80);
  }

  // حالة السوق: مباشر / مغلق
  var HOLI = ['2026-12-25', '2027-01-01']; // أيام إغلاق كامل، عدّلها حسب الحاجة
  var ETF = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' });
  function etParts(d) {
    var o = {};
    ETF.formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
    return { dow: { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[o.weekday], min: (+o.hour % 24) * 60 + (+o.minute), date: o.year + '-' + o.month + '-' + o.day };
  }
  function kindOf(item) {
    if (item.label === 'BTCUSD') return 'crypto';
    return { metals: 'metal', forex: 'forex', stocks: 'index' }[currentCat];
  }
  function isOpen(kind, d) {
    if (kind === 'crypto') return true;
    var t = etParts(d || new Date());
    if (HOLI.indexOf(t.date) > -1) return false;
    if (t.dow === 6) return false;                          // السبت
    if (t.dow === 5 && t.min >= 1020) return false;         // الجمعة بعد 17:00 نيويورك
    if (t.dow === 0 && t.min < (kind === 'forex' ? 1020 : 1080)) return false; // الأحد قبل الافتتاح
    if (kind !== 'forex' && t.min >= 1020 && t.min < 1080) return false;       // استراحة يومية ساعة
    return true;
  }
  function updateBadge() {
    var open = isOpen(kindOf(currentSymbol));
    var b = document.getElementById('liveBadge');
    b.textContent = open ? 'مباشر' : 'مغلق';
    b.classList.toggle('closed', !open);
  }

  // التصنيفات
  catsEl.querySelectorAll('button').forEach(function(btn) {
    btn.onclick = function() {
      catsEl.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentCat = btn.getAttribute('data-cat');
      currentSymbol = DATA[currentCat][0];
      renderSymbols();
      loadChart();
      history.replaceState(null, '', '?symbol=' + currentSymbol.label);
    };
  });

  // البداية
  var fromUrl = getQuerySymbol();
  if (fromUrl) {
    currentCat = fromUrl.cat;
    currentSymbol = fromUrl.item;
    catsEl.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-cat') === currentCat);
    });
  }

  renderSymbols();
  loadChart();
  setInterval(updateBadge, 30000);
})();
</script>
</body>
</html>
