<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<title>نتائج الصفقات | آفاق للوساطة المالية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0907; --surface:#14110a; --text:#f3e3b3; --muted:#a89b72; --gold:#d9b455; --line:#2e2814; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:Cairo,Tahoma,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
a { color:inherit; text-decoration:none; }
.wrap { max-width:800px; margin:0 auto; padding:0 16px; width:100%; }
header { background:var(--bg); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
header .wrap { display:flex; align-items:center; justify-content:space-between; height:58px; }
.brand { display:flex; align-items:center; gap:8px; font-family:"Reem Kufi",Cairo,sans-serif; font-size:15px; font-weight:600; }
.brand img { width:36px; height:36px; border-radius:50%; }
.back-btn { padding:7px 14px; border-radius:999px; border:1px solid #6e5a22; font-size:13px; }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px; text-align:center; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:40px 28px; max-width:420px; }
.card h1 { font-size:24px; margin-bottom:12px; color:#f6e7b8; }
.card p { color:var(--muted); font-size:15px; line-height:1.7; }
.badge { display:inline-block; margin-top:20px; background:#2a2210; color:var(--gold); padding:8px 18px; border-radius:999px; font-weight:700; font-size:14px; }
footer { border-top:1px solid var(--line); padding:14px 0; text-align:center; color:#8d8260; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="./"><img src="icon-192.png" alt="آفاق"><span>آفاق الوساطة المالية</span></a>
    <a class="back-btn" href="./">← الرئيسية</a>
  </div>
</header>
<main>
  <div class="card">
    <h1>نتائج الصفقات</h1>
    <p>هنا ستظهر نتائج الصفقات المستقبلية وتحليلاتها بشكل مفصل ومحدث.</p>
    <div class="badge">قريباً</div>
  </div>
</main>
<footer><div class="wrap">© 2026 آفاق للوساطة المالية</div></footer>
</body>
</html>
